appId: com.flowpaper.app
productName: FlowPaper
copyright: Copyright © 2026
directories:
  output: dist-release7
  buildResources: build
electronDist: node_modules/electron/dist
files:
  - dist
  - dist-electron
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: dir
      arch:
        - x64
  verifyUpdateCodeSignature: false
  signAndEditExecutable: false
  requestedExecutionLevel: requireAdministrator
forceCodeSigning: false
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
